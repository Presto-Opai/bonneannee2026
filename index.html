<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Don't Drag Me Out.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8C8 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameCanvas {
            border: 4px solid #5D4037;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #87CEEB;
        }

        .controls {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            text-align: center;
            max-width: 800px;
        }

        .controls h2 {
            color: #5D4037;
            margin-bottom: 10px;
        }

        .controls p {
            color: #333;
            margin: 5px 0;
        }

        .key {
            display: inline-block;
            padding: 5px 10px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 5px;
            font-weight: bold;
            margin: 0 3px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="controls">
        <h2>🚀 Please Don't Drag Me Out. 🌸</h2>
        <p>Contrôles: <span class="key">←</span> <span class="key">→</span> pour bouger | <span class="key">ESPACE</span> pour sauter</p>
        <p>Mission: Ne vous laissez pas distancer par la petite fille!</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration du jeu
        const GRAVITY = 0.6;
        const JUMP_FORCE = -13;
        const PLAYER_MOVE_SPEED = 8; // Augmenté de 5 à 8 pour suivre le scroll
        const GIRL_BASE_SPEED = 3.5;
        const GIRL_JUMP_FORCE = -15;
        const GROUND_LEVEL = 520;
        const GIRL_TARGET_X = 600;
        const MAX_JUMP_DISTANCE = 160; // Distance max sautée par l'astronaute
        const MAX_JUMP_HEIGHT = 140; // Hauteur max sautée

        // État du jeu
        let gameState = 'playing';
        let camera = { x: 0 };
        let score = 0;
        let highScore = 0;
        let distanceTraveled = 0;
        let animationFrame = 0; // Pour les animations
        let currentMessage = null;
        let messageTimer = 0;

        // Messages d'encouragement
        const messages = [
            { distance: 0, text: "BONNE ANNÉE! 🎉", color: '#FFD700' },
            { distance: 50, text: "Bien joué! Continue! 💪", color: '#4CAF50' },
            { distance: 100, text: "Tu assures! 🔥", color: '#FF9800' },
            { distance: 200, text: "Incroyable! 🌟", color: '#9C27B0' },
            { distance: 300, text: "Tu es une légende! 🏆", color: '#FFD700' },
            { distance: 500, text: "CHAMPION! 👑", color: '#FF1744' },
            { distance: 750, text: "INARRÊTABLE! 💎", color: '#00BCD4' },
            { distance: 1000, text: "ROI DE LA FÊTE! ⚡", color: '#FF4081' }
        ];

        // État des touches
        const keys = {
            left: false,
            right: false,
            space: false
        };

        // Joueur (Astronaute)
        const player = {
            x: 200,
            y: 300,
            width: 40,
            height: 60,
            velocityX: 0,
            velocityY: 0,
            onGround: false,
            direction: 1
        };

        // Petite fille
        const girl = {
            x: 600,
            y: 300,
            width: 35,
            height: 55,
            velocityX: GIRL_BASE_SPEED,
            velocityY: 0,
            onGround: false,
            direction: 1,
            speedMultiplier: 1,
            nextSpeedChange: 100
        };

        // Terrain
        let terrainSegments = [];
        let platforms = [];
        let walls = [];
        let gaps = [];
        let nextSegmentX = 0;
        let backgroundElements = [];

        // Génération initiale du terrain
        function initTerrain() {
            terrainSegments = [];
            platforms = [];
            walls = [];
            gaps = [];
            backgroundElements = [];
            nextSegmentX = 0;
            // Afficher "BONNE ANNÉE" au démarrage
            currentMessage = messages[0];
            messageTimer = 180; // 3 secondes pour bien voir le message

            // Zone de départ sûre
            for (let i = 0; i < 5; i++) {
                generateTerrainSegment(false);
            }

            // Terrain normal
            for (let i = 0; i < 20; i++) {
                generateTerrainSegment(true);
            }
        }

        // Générer un segment de terrain
        function generateTerrainSegment(allowGaps) {
            const segmentWidth = 150 + Math.random() * 100;

            if (allowGaps && Math.random() < 0.3) {
                // Créer un trou
                const gapWidth = 80 + Math.random() * 70; // Limité à 150px max
                const gapStart = nextSegmentX;
                const gapEnd = nextSegmentX + gapWidth;

                gaps.push({ start: gapStart, end: gapEnd });

                // TOUJOURS des plateformes bien espacées
                const platformCount = 2 + Math.floor(gapWidth / 80);
                for (let i = 0; i < platformCount; i++) {
                    const platformX = gapStart + (gapWidth / (platformCount + 1)) * (i + 1);
                    const platformY = GROUND_LEVEL - 100 - Math.random() * 40; // Hauteur raisonnable

                    platforms.push({
                        x: platformX - 60,
                        y: platformY,
                        width: 100 + Math.random() * 40,
                        height: 20,
                        color: '#8D6E63'
                    });
                }

                nextSegmentX += gapWidth;
            } else {
                // Sol normal
                terrainSegments.push({
                    x: nextSegmentX,
                    y: GROUND_LEVEL,
                    width: segmentWidth,
                    height: 80,
                    color: '#5D4037'
                });

                // Plateformes flottantes raisonnables
                if (Math.random() < 0.15) {
                    platforms.push({
                        x: nextSegmentX + Math.random() * (segmentWidth - 120),
                        y: GROUND_LEVEL - 80 - Math.random() * 80,
                        width: 100 + Math.random() * 60,
                        height: 20,
                        color: '#8D6E63'
                    });
                }

                // Barrières avec plateformes en escalier
                if (Math.random() < 0.12 && segmentWidth > 300) {
                    const wallX = nextSegmentX + 150;

                    // Escalier de plateformes AVANT le mur
                    for (let i = 0; i < 3; i++) {
                        platforms.push({
                            x: wallX - 250 + i * 80,
                            y: GROUND_LEVEL - 100 - i * 50,
                            width: 100,
                            height: 20,
                            color: '#8D6E63'
                        });
                    }

                    walls.push({
                        x: wallX,
                        y: GROUND_LEVEL - 150,
                        width: 20,
                        height: 150,
                        color: '#795548'
                    });
                }

                // Éléments décoratifs
                if (Math.random() < 0.5) {
                    const type = Math.random();
                    if (type < 0.3) {
                        backgroundElements.push({
                            type: 'flower',
                            x: nextSegmentX + Math.random() * segmentWidth,
                            y: GROUND_LEVEL - 5,
                            color: Math.random() < 0.5 ? '#FF69B4' : '#FFD700',
                            size: 10 + Math.random() * 8
                        });
                    } else if (type < 0.5) {
                        backgroundElements.push({
                            type: 'tree',
                            x: nextSegmentX + Math.random() * segmentWidth,
                            y: GROUND_LEVEL - 60,
                            size: 50 + Math.random() * 40
                        });
                    } else if (type < 0.7) {
                        backgroundElements.push({
                            type: 'hiker',
                            x: nextSegmentX + Math.random() * segmentWidth,
                            y: GROUND_LEVEL - 45,
                            direction: Math.random() < 0.5 ? 1 : -1
                        });
                    } else {
                        backgroundElements.push({
                            type: 'party',
                            x: nextSegmentX + Math.random() * (segmentWidth - 120),
                            y: GROUND_LEVEL - 50
                        });
                    }
                }

                nextSegmentX += segmentWidth;
            }
        }

        // Gestion des événements clavier
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                keys.space = true;
                e.preventDefault();
            }

            if (gameState === 'gameover' && (e.key === 'r' || e.key === 'R' || e.key === ' ')) {
                resetGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.space = false;
        });

        // Dessiner astronaute avec animation
        function drawAstronaut(x, y, direction) {
            const screenX = x - camera.x;
            const legOffset = player.onGround && Math.abs(player.velocityX) > 0
                ? Math.sin(animationFrame * 0.3) * 5 : 0;

            ctx.save();
            ctx.translate(screenX + 20, y + 30);
            if (direction < 0) ctx.scale(-1, 1);

            // Casque
            ctx.fillStyle = '#E0E0E0';
            ctx.beginPath();
            ctx.arc(0, -20, 18, 0, Math.PI * 2);
            ctx.fill();

            // Vitre
            ctx.fillStyle = '#64B5F6';
            ctx.beginPath();
            ctx.arc(0, -20, 12, 0, Math.PI * 2);
            ctx.fill();

            // Corps
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(-12, 0, 24, 30);

            // Détails
            ctx.fillStyle = '#FF5252';
            ctx.fillRect(-12, 10, 24, 3);
            ctx.fillRect(-12, 18, 24, 3);

            // Bras
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(-18, 5, 6, 20);
            ctx.fillRect(12, 5, 6, 20);

            // Jambes animées
            ctx.fillStyle = '#BDBDBD';
            ctx.fillRect(-10, 30 + legOffset, 8, 20);
            ctx.fillRect(2, 30 - legOffset, 8, 20);

            // Bottes
            ctx.fillStyle = '#424242';
            ctx.fillRect(-10, 48 + legOffset, 8, 8);
            ctx.fillRect(2, 48 - legOffset, 8, 8);

            ctx.restore();
        }

        // Dessiner la petite fille avec animation
        function drawGirl(x, y, direction) {
            const screenX = x - camera.x;
            const legOffset = girl.onGround ? Math.sin(animationFrame * 0.35) * 4 : 0;

            ctx.save();
            ctx.translate(screenX + 17, y + 27);
            if (direction < 0) ctx.scale(-1, 1);

            // Cheveux
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, -18, 14, 0, Math.PI * 2);
            ctx.fill();

            // Tête
            ctx.fillStyle = '#FDBCB4';
            ctx.beginPath();
            ctx.arc(0, -18, 10, 0, Math.PI * 2);
            ctx.fill();

            // Robe
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.lineTo(10, 0);
            ctx.lineTo(12, 25);
            ctx.lineTo(-12, 25);
            ctx.closePath();
            ctx.fill();

            // Bras
            ctx.fillStyle = '#FDBCB4';
            ctx.fillRect(-14, 2, 4, 15);
            ctx.fillRect(10, 2, 4, 15);

            // Jambes animées
            ctx.fillStyle = '#FDBCB4';
            ctx.fillRect(-7, 25 + legOffset, 5, 18);
            ctx.fillRect(2, 25 - legOffset, 5, 18);

            // Chaussures
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-7, 42 + legOffset, 5, 5);
            ctx.fillRect(2, 42 - legOffset, 5, 5);

            ctx.restore();
        }

        // Dessiner éléments d'arrière-plan
        function drawBackgroundElement(element) {
            const screenX = element.x - camera.x * 0.8;

            if (element.type === 'flower') {
                ctx.strokeStyle = '#4CAF50';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(screenX, element.y);
                ctx.lineTo(screenX, element.y - element.size);
                ctx.stroke();

                ctx.fillStyle = element.color;
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.arc(
                        screenX + Math.cos(i * Math.PI * 2 / 5) * element.size * 0.4,
                        element.y - element.size + Math.sin(i * Math.PI * 2 / 5) * element.size * 0.4,
                        element.size * 0.3,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }

                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(screenX, element.y - element.size, element.size * 0.2, 0, Math.PI * 2);
                ctx.fill();
            } else if (element.type === 'tree') {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(screenX - 5, element.y + 20, 10, 40);

                ctx.fillStyle = '#228B22';
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(screenX, element.y - i * 15);
                    ctx.lineTo(screenX - 20 + i * 3, element.y + 20 - i * 15);
                    ctx.lineTo(screenX + 20 - i * 3, element.y + 20 - i * 15);
                    ctx.closePath();
                    ctx.fill();
                }
            } else if (element.type === 'hiker') {
                ctx.save();
                ctx.translate(screenX, element.y + 20);
                if (element.direction < 0) ctx.scale(-1, 1);

                ctx.fillStyle = '#FDBCB4';
                ctx.beginPath();
                ctx.arc(0, -15, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#FF6347';
                ctx.fillRect(-10, 0, 15, 20);

                ctx.fillStyle = '#4169E1';
                ctx.fillRect(-6, 0, 12, 18);

                ctx.fillStyle = '#2C3E50';
                ctx.fillRect(-6, 18, 5, 12);
                ctx.fillRect(1, 18, 5, 12);

                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(8, 5);
                ctx.lineTo(10, 25);
                ctx.stroke();

                ctx.restore();
            } else if (element.type === 'party') {
                for (let i = 0; i < 3; i++) {
                    ctx.save();
                    ctx.translate(screenX + i * 35, element.y + 25);

                    ctx.fillStyle = '#FDBCB4';
                    ctx.beginPath();
                    ctx.arc(0, -18, 9, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = i === 0 ? '#8B4513' : i === 1 ? '#FFD700' : '#2C3E50';
                    ctx.beginPath();
                    ctx.arc(0, -20, 10, Math.PI, 0);
                    ctx.fill();

                    const colors = ['#FF6347', '#4169E1', '#32CD32'];
                    ctx.fillStyle = colors[i];
                    ctx.fillRect(-8, 0, 16, 20);

                    ctx.fillStyle = '#2C3E50';
                    ctx.fillRect(-6, 20, 5, 15);
                    ctx.fillRect(1, 20, 5, 15);

                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(i % 2 === 0 ? 8 : -12, 8, 6, 12);

                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(i % 2 === 0 ? 8 : -12, 8, 6, 3);

                    ctx.restore();
                }

                ctx.fillStyle = '#8B4513';
                ctx.fillRect(screenX + 40, element.y + 40, 30, 5);
            }
        }

        function checkCollision(entity, platform) {
            return entity.x < platform.x + platform.width &&
                   entity.x + entity.width > platform.x &&
                   entity.y < platform.y + platform.height &&
                   entity.y + entity.height > platform.y;
        }

        function isAboveGap(x) {
            return gaps.some(gap => x >= gap.start && x <= gap.end);
        }

        function updatePhysics(entity, isPlayer = false) {
            entity.velocityY += GRAVITY;
            entity.y += entity.velocityY;
            entity.x += entity.velocityX;

            entity.onGround = false;

            const allSurfaces = [...terrainSegments, ...platforms];

            allSurfaces.forEach(surface => {
                if (checkCollision(entity, surface)) {
                    if (entity.velocityY > 0 && entity.y + entity.height - entity.velocityY <= surface.y + 5) {
                        entity.y = surface.y - entity.height;
                        entity.velocityY = 0;
                        entity.onGround = true;
                    }
                    else if (entity.velocityY < 0 && entity.y - entity.velocityY >= surface.y + surface.height - 5) {
                        entity.y = surface.y + surface.height;
                        entity.velocityY = 0;
                    }
                }
            });

            if (isPlayer) {
                walls.forEach(wall => {
                    if (checkCollision(entity, wall)) {
                        if (entity.velocityX > 0) {
                            entity.x = wall.x - entity.width;
                        } else if (entity.velocityX < 0) {
                            entity.x = wall.x + wall.width;
                        }
                    }
                });
            }
        }

        function updatePlayer() {
            if (gameState !== 'playing') return;

            // Accélération progressive RAPIDE pour suivre le scroll
            const speedBonus = distanceTraveled / 1800; // Accélère plus vite (était 3000)

            player.velocityX = 0;

            if (keys.left) {
                player.velocityX = -(PLAYER_MOVE_SPEED + speedBonus);
                player.direction = -1;
            }
            if (keys.right) {
                player.velocityX = PLAYER_MOVE_SPEED + speedBonus;
                player.direction = 1;
            }

            if (keys.space && player.onGround) {
                player.velocityY = JUMP_FORCE;
            }

            updatePhysics(player, true);

            if (player.x < camera.x - 50) {
                gameOver();
            }

            if (player.y > canvas.height + 100) {
                gameOver();
            }
        }

        function updateGirl() {
            if (gameState !== 'playing') return;

            // Accélération progressive SANS LIMITE
            const speedBonus = distanceTraveled / 3000; // Augmente indéfiniment

            if (girl.x >= girl.nextSpeedChange) {
                girl.speedMultiplier = 0.7 + Math.random() * 0.8 + speedBonus;
                girl.nextSpeedChange = girl.x + 150 + Math.random() * 300;
            }

            girl.velocityX = GIRL_BASE_SPEED * girl.speedMultiplier;

            // Détection des trous AMÉLIORÉE avec lookAhead adaptatif
            // Plus elle va vite, plus elle regarde loin
            const lookAheadDistance = 100 + girl.velocityX * 15;

            // Vérifier plusieurs points devant elle pour être sûr
            let gapDetected = false;
            for (let i = 0; i < 5; i++) {
                const checkPoint = girl.x + 50 + (i * 30);
                if (isAboveGap(checkPoint)) {
                    gapDetected = true;
                    break;
                }
            }

            if (gapDetected && girl.onGround) {
                girl.velocityY = GIRL_JUMP_FORCE;
            }

            // Sauter devant les murs
            walls.forEach(wall => {
                if (wall.x > girl.x && wall.x < girl.x + lookAheadDistance && girl.onGround) {
                    girl.velocityY = GIRL_JUMP_FORCE;
                }
            });

            updatePhysics(girl, false);
        }

        function updateCamera() {
            const targetCameraX = girl.x - GIRL_TARGET_X;
            camera.x = targetCameraX;

            while (nextSegmentX < camera.x + canvas.width + 500) {
                generateTerrainSegment(true);
            }

            // Cleanup avec correction pour la parallaxe
            const cleanupX = camera.x - 200;
            terrainSegments = terrainSegments.filter(seg => seg.x + seg.width > cleanupX);
            platforms = platforms.filter(plat => plat.x + plat.width > cleanupX);
            walls = walls.filter(wall => wall.x + wall.width > cleanupX);
            gaps = gaps.filter(gap => gap.end > cleanupX);
            // FIX: Correction pour les éléments de background avec parallaxe
            backgroundElements = backgroundElements.filter(elem => elem.x > camera.x * 0.8 - 300);
        }

        function updateMessages() {
            const currentDist = Math.floor(distanceTraveled / 10);

            // Chercher un nouveau message
            for (let msg of messages) {
                if (currentDist >= msg.distance && (!currentMessage || currentMessage.distance < msg.distance)) {
                    currentMessage = msg;
                    messageTimer = 120; // 2 secondes à 60fps
                    break;
                }
            }

            if (messageTimer > 0) {
                messageTimer--;
            } else {
                currentMessage = null;
            }
        }

        function gameOver() {
            gameState = 'gameover';
            score = Math.floor(distanceTraveled / 10);
            if (score > highScore) {
                highScore = score;
            }
        }

        function resetGame() {
            gameState = 'playing';

            player.x = 200;
            player.y = 300;
            player.velocityX = 0;
            player.velocityY = 0;
            player.onGround = false;
            player.direction = 1;

            girl.x = 600;
            girl.y = 300;
            girl.velocityX = GIRL_BASE_SPEED;
            girl.velocityY = 0;
            girl.onGround = false;
            girl.speedMultiplier = 1;
            girl.nextSpeedChange = 100;

            camera.x = 0;
            score = 0;
            distanceTraveled = 0;
            animationFrame = 0;

            initTerrain();
        }

        function drawTerrain() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFFFFF';
            for (let i = 0; i < 6; i++) {
                const cloudX = (i * 280 - camera.x * 0.3) % (canvas.width + 200) - 100;
                ctx.beginPath();
                ctx.arc(cloudX, 60 + i * 25, 35, 0, Math.PI * 2);
                ctx.arc(cloudX + 25, 70 + i * 25, 28, 0, Math.PI * 2);
                ctx.arc(cloudX + 50, 65 + i * 25, 32, 0, Math.PI * 2);
                ctx.fill();
            }

            backgroundElements.forEach(elem => {
                if (elem.x - camera.x * 0.8 > -200 && elem.x - camera.x * 0.8 < canvas.width + 200) {
                    drawBackgroundElement(elem);
                }
            });

            ctx.fillStyle = '#7EC850';
            ctx.fillRect(0, GROUND_LEVEL - 20, canvas.width, 20);

            terrainSegments.forEach(segment => {
                const screenX = segment.x - camera.x;
                ctx.fillStyle = segment.color;
                ctx.fillRect(screenX, segment.y, segment.width, segment.height);

                ctx.fillStyle = '#4CAF50';
                for (let i = 0; i < segment.width; i += 10) {
                    ctx.fillRect(screenX + i, segment.y - 5, 2, 5);
                    ctx.fillRect(screenX + i + 4, segment.y - 7, 2, 7);
                    ctx.fillRect(screenX + i + 7, segment.y - 4, 2, 4);
                }
            });

            platforms.forEach(platform => {
                const screenX = platform.x - camera.x;
                ctx.fillStyle = platform.color;
                ctx.fillRect(screenX, platform.y, platform.width, platform.height);

                ctx.fillStyle = '#4CAF50';
                for (let i = 0; i < platform.width; i += 10) {
                    ctx.fillRect(screenX + i, platform.y - 5, 2, 5);
                    ctx.fillRect(screenX + i + 4, platform.y - 7, 2, 7);
                    ctx.fillRect(screenX + i + 7, platform.y - 4, 2, 4);
                }
            });

            walls.forEach(wall => {
                const screenX = wall.x - camera.x;
                ctx.fillStyle = wall.color;
                ctx.fillRect(screenX, wall.y, wall.width, wall.height);

                ctx.strokeStyle = '#5D4037';
                ctx.lineWidth = 1;
                for (let y = 0; y < wall.height; y += 20) {
                    for (let x = 0; x < wall.width; x += 20) {
                        ctx.strokeRect(screenX + x, wall.y + y, 20, 20);
                    }
                }
            });
        }

        function drawHUD() {
            // Score
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(10, 10, 200, 40);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Distance: ${Math.floor(distanceTraveled / 10)}m`, 20, 38);

            // High Score
            if (highScore > 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(canvas.width - 210, 10, 200, 40);
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(`Best: ${highScore}m`, canvas.width - 20, 36);
            }

            // Message d'encouragement
            if (currentMessage && messageTimer > 0) {
                const opacity = messageTimer < 30 ? messageTimer / 30 : 1;
                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.fillStyle = currentMessage.color;
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 4;
                ctx.strokeText(currentMessage.text, canvas.width / 2, 150);
                ctx.fillText(currentMessage.text, canvas.width / 2, 150);
                ctx.restore();
            }
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 80);

            ctx.font = 'bold 36px Arial';
            ctx.fillStyle = '#FFD700';
            ctx.fillText(`Distance: ${score}m`, canvas.width / 2, canvas.height / 2 - 10);

            if (score === highScore && score > 0) {
                ctx.fillStyle = '#FF69B4';
                ctx.font = 'bold 28px Arial';
                ctx.fillText('🌟 NOUVEAU RECORD! 🌟', canvas.width / 2, canvas.height / 2 + 40);
            }

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '24px Arial';
            ctx.fillText('Appuyez sur ESPACE ou R pour rejouer', canvas.width / 2, canvas.height / 2 + 100);
        }

        function gameLoop() {
            animationFrame++;

            if (gameState === 'playing') {
                updatePlayer();
                updateGirl();
                updateCamera();
                updateMessages();

                distanceTraveled = girl.x;
            }

            drawTerrain();
            drawGirl(girl.x, girl.y, girl.direction);
            drawAstronaut(player.x, player.y, player.direction);
            drawHUD();

            if (gameState === 'gameover') {
                drawGameOver();
            }

            requestAnimationFrame(gameLoop);
        }

        initTerrain();
        gameLoop();
    </script>
</body>
</html>
