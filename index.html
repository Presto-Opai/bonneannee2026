<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Don't Drag Me Out.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8C8 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameCanvas {
            border: 4px solid #5D4037;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #7EC850;
        }

        .controls {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            text-align: center;
            max-width: 800px;
        }

        .controls h2 {
            color: #5D4037;
            margin-bottom: 10px;
        }

        .controls p {
            color: #333;
            margin: 5px 0;
        }

        .key {
            display: inline-block;
            padding: 5px 10px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 5px;
            font-weight: bold;
            margin: 0 3px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="controls">
        <h2>🚀 Please Don't Drag Me Out. 🌸</h2>
        <p>Contrôles: <span class="key">←</span> <span class="key">→</span> pour bouger | <span class="key">ESPACE</span> pour sauter</p>
        <p>Mission: Ne vous laissez pas distancer par la petite fille!</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration du jeu
        const GRAVITY = 0.6;
        const JUMP_FORCE = -13;
        const PLAYER_MOVE_SPEED = 5;
        const GIRL_BASE_SPEED = 3.5;
        const GIRL_JUMP_FORCE = -15;
        const GROUND_LEVEL = 520;
        const GIRL_TARGET_X = 600; // Position cible de la fille (3/4 de l'écran)

        // État du jeu
        let gameState = 'playing'; // 'playing' ou 'gameover'
        let camera = { x: 0 };
        let score = 0;
        let highScore = 0;
        let distanceTraveled = 0;

        // État des touches
        const keys = {
            left: false,
            right: false,
            space: false
        };

        // Joueur (Astronaute)
        const player = {
            x: 200,
            y: 300,
            width: 40,
            height: 60,
            velocityX: 0,
            velocityY: 0,
            onGround: false,
            direction: 1
        };

        // Petite fille
        const girl = {
            x: 600,
            y: 300,
            width: 35,
            height: 55,
            velocityX: GIRL_BASE_SPEED,
            velocityY: 0,
            onGround: false,
            direction: 1,
            speedMultiplier: 1,
            nextSpeedChange: 100,
            nextJump: 200
        };

        // Terrain (segments de sol et trous)
        let terrainSegments = [];
        let platforms = [];
        let walls = [];
        let nextSegmentX = 0;

        // Génération initiale du terrain
        function initTerrain() {
            terrainSegments = [];
            platforms = [];
            walls = [];
            nextSegmentX = 0;

            // Créer le terrain initial (zone de départ sûre)
            for (let i = 0; i < 5; i++) {
                generateTerrainSegment(false); // Pas de trous au début
            }

            // Continuer avec terrain normal
            for (let i = 0; i < 20; i++) {
                generateTerrainSegment(true);
            }
        }

        // Générer un segment de terrain
        function generateTerrainSegment(allowGaps) {
            const segmentWidth = 150 + Math.random() * 100;

            if (allowGaps && Math.random() < 0.3) {
                // Créer un trou
                const gapWidth = 80 + Math.random() * 120;

                // Ajouter des plateformes au-dessus du trou
                if (Math.random() < 0.7) {
                    const platformCount = 1 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < platformCount; i++) {
                        platforms.push({
                            x: nextSegmentX + gapWidth * (i + 1) / (platformCount + 1) - 40,
                            y: GROUND_LEVEL - 80 - Math.random() * 100,
                            width: 80 + Math.random() * 60,
                            height: 20,
                            color: '#8D6E63'
                        });
                    }
                }

                nextSegmentX += gapWidth;
            } else {
                // Sol normal
                terrainSegments.push({
                    x: nextSegmentX,
                    y: GROUND_LEVEL,
                    width: segmentWidth,
                    height: 80,
                    color: '#5D4037'
                });

                // Parfois ajouter des plateformes flottantes
                if (Math.random() < 0.2) {
                    platforms.push({
                        x: nextSegmentX + Math.random() * (segmentWidth - 100),
                        y: GROUND_LEVEL - 100 - Math.random() * 150,
                        width: 80 + Math.random() * 80,
                        height: 20,
                        color: '#8D6E63'
                    });
                }

                // Parfois ajouter des barrières verticales
                if (Math.random() < 0.15 && segmentWidth > 200) {
                    walls.push({
                        x: nextSegmentX + 50 + Math.random() * (segmentWidth - 150),
                        y: GROUND_LEVEL - 150,
                        width: 20,
                        height: 150,
                        color: '#795548'
                    });
                }

                nextSegmentX += segmentWidth;
            }
        }

        // Gestion des événements clavier
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                keys.space = true;
                e.preventDefault();
            }

            // Restart avec R ou Espace après game over
            if (gameState === 'gameover' && (e.key === 'r' || e.key === 'R' || e.key === ' ')) {
                resetGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.space = false;
        });

        // Dessiner un personnage (astronaute)
        function drawAstronaut(x, y, direction) {
            const screenX = x - camera.x;

            ctx.save();
            ctx.translate(screenX + 20, y + 30);
            if (direction < 0) ctx.scale(-1, 1);

            // Casque
            ctx.fillStyle = '#E0E0E0';
            ctx.beginPath();
            ctx.arc(0, -20, 18, 0, Math.PI * 2);
            ctx.fill();

            // Vitre du casque
            ctx.fillStyle = '#64B5F6';
            ctx.beginPath();
            ctx.arc(0, -20, 12, 0, Math.PI * 2);
            ctx.fill();

            // Corps
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(-12, 0, 24, 30);

            // Détails de la combinaison
            ctx.fillStyle = '#FF5252';
            ctx.fillRect(-12, 10, 24, 3);
            ctx.fillRect(-12, 18, 24, 3);

            // Bras
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(-18, 5, 6, 20);
            ctx.fillRect(12, 5, 6, 20);

            // Jambes
            ctx.fillStyle = '#BDBDBD';
            ctx.fillRect(-10, 30, 8, 20);
            ctx.fillRect(2, 30, 8, 20);

            // Bottes
            ctx.fillStyle = '#424242';
            ctx.fillRect(-10, 48, 8, 8);
            ctx.fillRect(2, 48, 8, 8);

            ctx.restore();
        }

        // Dessiner la petite fille
        function drawGirl(x, y, direction) {
            const screenX = x - camera.x;

            ctx.save();
            ctx.translate(screenX + 17, y + 27);
            if (direction < 0) ctx.scale(-1, 1);

            // Cheveux blonds
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, -18, 14, 0, Math.PI * 2);
            ctx.fill();

            // Tête
            ctx.fillStyle = '#FDBCB4';
            ctx.beginPath();
            ctx.arc(0, -18, 10, 0, Math.PI * 2);
            ctx.fill();

            // Robe rose
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.lineTo(10, 0);
            ctx.lineTo(12, 25);
            ctx.lineTo(-12, 25);
            ctx.closePath();
            ctx.fill();

            // Bras
            ctx.fillStyle = '#FDBCB4';
            ctx.fillRect(-14, 2, 4, 15);
            ctx.fillRect(10, 2, 4, 15);

            // Jambes
            ctx.fillStyle = '#FDBCB4';
            ctx.fillRect(-7, 25, 5, 18);
            ctx.fillRect(2, 25, 5, 18);

            // Chaussures
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-7, 42, 5, 5);
            ctx.fillRect(2, 42, 5, 5);

            ctx.restore();
        }

        // Vérifier collision avec une plateforme
        function checkCollision(entity, platform) {
            return entity.x < platform.x + platform.width &&
                   entity.x + entity.width > platform.x &&
                   entity.y < platform.y + platform.height &&
                   entity.y + entity.height > platform.y;
        }

        // Mettre à jour la physique d'une entité
        function updatePhysics(entity, isPlayer = false) {
            entity.velocityY += GRAVITY;
            entity.y += entity.velocityY;
            entity.x += entity.velocityX;

            entity.onGround = false;

            // Collecter toutes les surfaces (terrain + plateformes)
            const allSurfaces = [...terrainSegments, ...platforms];

            // Vérifier les collisions
            allSurfaces.forEach(surface => {
                if (checkCollision(entity, surface)) {
                    // Collision par le bas (atterrissage)
                    if (entity.velocityY > 0 && entity.y + entity.height - entity.velocityY <= surface.y + 5) {
                        entity.y = surface.y - entity.height;
                        entity.velocityY = 0;
                        entity.onGround = true;
                    }
                    // Collision par le haut
                    else if (entity.velocityY < 0 && entity.y - entity.velocityY >= surface.y + surface.height - 5) {
                        entity.y = surface.y + surface.height;
                        entity.velocityY = 0;
                    }
                }
            });

            // Collision avec les murs (uniquement pour le joueur)
            if (isPlayer) {
                walls.forEach(wall => {
                    if (checkCollision(entity, wall)) {
                        // Bloquer le mouvement horizontal
                        if (entity.velocityX > 0) {
                            entity.x = wall.x - entity.width;
                        } else if (entity.velocityX < 0) {
                            entity.x = wall.x + wall.width;
                        }
                    }
                });
            }
        }

        // Mettre à jour le joueur
        function updatePlayer() {
            if (gameState !== 'playing') return;

            player.velocityX = 0;

            if (keys.left) {
                player.velocityX = -PLAYER_MOVE_SPEED;
                player.direction = -1;
            }
            if (keys.right) {
                player.velocityX = PLAYER_MOVE_SPEED;
                player.direction = 1;
            }

            if (keys.space && player.onGround) {
                player.velocityY = JUMP_FORCE;
            }

            updatePhysics(player, true);

            // Vérifier si le joueur est sorti de l'écran (game over)
            if (player.x < camera.x - 50) {
                gameOver();
            }

            // Vérifier si le joueur est tombé (game over)
            if (player.y > canvas.height + 100) {
                gameOver();
            }
        }

        // Mettre à jour la petite fille (IA)
        function updateGirl() {
            if (gameState !== 'playing') return;

            // Varier la vitesse
            if (girl.x >= girl.nextSpeedChange) {
                girl.speedMultiplier = 0.7 + Math.random() * 0.8;
                girl.nextSpeedChange = girl.x + 150 + Math.random() * 300;
            }

            girl.velocityX = GIRL_BASE_SPEED * girl.speedMultiplier;

            // Sauter par-dessus les trous et obstacles
            if (girl.x >= girl.nextJump) {
                if (girl.onGround) {
                    girl.velocityY = GIRL_JUMP_FORCE;
                    girl.nextJump = girl.x + 100 + Math.random() * 400;
                }
            }

            // Sauter automatiquement devant les murs
            walls.forEach(wall => {
                if (wall.x > girl.x && wall.x < girl.x + 100 && girl.onGround) {
                    girl.velocityY = GIRL_JUMP_FORCE;
                }
            });

            updatePhysics(girl, false);
        }

        // Mettre à jour la caméra
        function updateCamera() {
            // La caméra suit la fille pour la garder à 3/4 de l'écran
            const targetCameraX = girl.x - GIRL_TARGET_X;
            camera.x = targetCameraX;

            // Générer plus de terrain si nécessaire
            while (nextSegmentX < camera.x + canvas.width + 500) {
                generateTerrainSegment(true);
            }

            // Nettoyer les éléments hors écran
            terrainSegments = terrainSegments.filter(seg => seg.x + seg.width > camera.x - 200);
            platforms = platforms.filter(plat => plat.x + plat.width > camera.x - 200);
            walls = walls.filter(wall => wall.x + wall.width > camera.x - 200);
        }

        // Game Over
        function gameOver() {
            gameState = 'gameover';
            score = Math.floor(distanceTraveled / 10);
            if (score > highScore) {
                highScore = score;
            }
        }

        // Reset le jeu
        function resetGame() {
            gameState = 'playing';

            player.x = 200;
            player.y = 300;
            player.velocityX = 0;
            player.velocityY = 0;
            player.onGround = false;
            player.direction = 1;

            girl.x = 600;
            girl.y = 300;
            girl.velocityX = GIRL_BASE_SPEED;
            girl.velocityY = 0;
            girl.onGround = false;
            girl.speedMultiplier = 1;
            girl.nextSpeedChange = 100;
            girl.nextJump = 200;

            camera.x = 0;
            score = 0;
            distanceTraveled = 0;

            initTerrain();
        }

        // Dessiner le terrain
        function drawTerrain() {
            // Dessiner le ciel en arrière-plan
            ctx.fillStyle = '#7EC850';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Nuages
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 5; i++) {
                const cloudX = (i * 300 - camera.x * 0.3) % (canvas.width + 200) - 100;
                ctx.beginPath();
                ctx.arc(cloudX, 80 + i * 30, 40, 0, Math.PI * 2);
                ctx.arc(cloudX + 30, 90 + i * 30, 30, 0, Math.PI * 2);
                ctx.arc(cloudX + 60, 85 + i * 30, 35, 0, Math.PI * 2);
                ctx.fill();
            }

            // Dessiner les segments de terrain
            terrainSegments.forEach(segment => {
                const screenX = segment.x - camera.x;
                ctx.fillStyle = segment.color;
                ctx.fillRect(screenX, segment.y, segment.width, segment.height);

                // Herbe sur le sol
                ctx.fillStyle = '#4CAF50';
                for (let i = 0; i < segment.width; i += 10) {
                    ctx.fillRect(screenX + i, segment.y - 5, 2, 5);
                    ctx.fillRect(screenX + i + 4, segment.y - 7, 2, 7);
                    ctx.fillRect(screenX + i + 7, segment.y - 4, 2, 4);
                }
            });

            // Dessiner les plateformes
            platforms.forEach(platform => {
                const screenX = platform.x - camera.x;
                ctx.fillStyle = platform.color;
                ctx.fillRect(screenX, platform.y, platform.width, platform.height);

                // Herbe sur les plateformes
                ctx.fillStyle = '#4CAF50';
                for (let i = 0; i < platform.width; i += 10) {
                    ctx.fillRect(screenX + i, platform.y - 5, 2, 5);
                    ctx.fillRect(screenX + i + 4, platform.y - 7, 2, 7);
                    ctx.fillRect(screenX + i + 7, platform.y - 4, 2, 4);
                }
            });

            // Dessiner les murs
            walls.forEach(wall => {
                const screenX = wall.x - camera.x;
                ctx.fillStyle = wall.color;
                ctx.fillRect(screenX, wall.y, wall.width, wall.height);

                // Texture de brique
                ctx.strokeStyle = '#5D4037';
                ctx.lineWidth = 1;
                for (let y = 0; y < wall.height; y += 20) {
                    for (let x = 0; x < wall.width; x += 20) {
                        ctx.strokeRect(screenX + x, wall.y + y, 20, 20);
                    }
                }
            });
        }

        // Dessiner le HUD (score, etc.)
        function drawHUD() {
            // Score actuel (distance)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(10, 10, 200, 40);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Distance: ${Math.floor(distanceTraveled / 10)}m`, 20, 38);

            // High Score
            if (highScore > 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(canvas.width - 210, 10, 200, 40);
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(`Best: ${highScore}m`, canvas.width - 20, 36);
            }
        }

        // Dessiner l'écran de game over
        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 80);

            ctx.font = 'bold 36px Arial';
            ctx.fillStyle = '#FFD700';
            ctx.fillText(`Distance: ${score}m`, canvas.width / 2, canvas.height / 2 - 10);

            if (score === highScore && score > 0) {
                ctx.fillStyle = '#FF69B4';
                ctx.font = 'bold 28px Arial';
                ctx.fillText('🌟 NOUVEAU RECORD! 🌟', canvas.width / 2, canvas.height / 2 + 40);
            }

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '24px Arial';
            ctx.fillText('Appuyez sur ESPACE ou R pour rejouer', canvas.width / 2, canvas.height / 2 + 100);
        }

        // Fonction principale de jeu
        function gameLoop() {
            if (gameState === 'playing') {
                updatePlayer();
                updateGirl();
                updateCamera();

                // Mettre à jour le score (distance)
                distanceTraveled = girl.x;
            }

            // Dessiner tout
            drawTerrain();
            drawGirl(girl.x, girl.y, girl.direction);
            drawAstronaut(player.x, player.y, player.direction);
            drawHUD();

            if (gameState === 'gameover') {
                drawGameOver();
            }

            requestAnimationFrame(gameLoop);
        }

        // Initialiser et démarrer le jeu
        initTerrain();
        gameLoop();
    </script>
</body>
</html>
